[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pause-resume-snapshot"
version = "0.1.0"
description = "Deterministic state serializer capturing call stacks and execution frames for instant suspension and resumption"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-pause-resume-snapshot = "agent_pause_resume_snapshot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_pause_resume_snapshot*"]
